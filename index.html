function draw(){
 const base=D.items.filter(p=>(!S.a||p.a===S.a)&&(!S.g||p.g));
 const L=base.filter(p=>!S.t||p.t===S.t);

 document.getElementById("lh").textContent=`Postări · ${L.length}`;
