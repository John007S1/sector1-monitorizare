<style>
/* Layout: iOS "glass" app — soft civic gradient field behind frosted cards; large-title screens, bottom tab bar, bottom sheets. Phone-first single column. */
:root{
  --bg:#EEF1F8; --field-a:#C9DAFF; --field-b:#FFD9C7; --field-c:#D3F1E4;

  --accent:#2457F5; --accent-2:#7B5CFF; --accent-soft:rgba(36,87,245,.12); --on-accent:#FFFFFF;
  --urgent:#E5402E; --urgent-soft:rgba(229,64,46,.13); --good:#18A058; --good-soft:rgba(24,160,88,.14); --warn:#D98A0B; --warn-soft:rgba(217,138,11,.15);
  --shadow:0 1px 1px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.07);
  --t-light:#F2A50C; --t-road:#8B6440; --t-safe:#E5402E; --t-trash:#2F9D62; --t-park:#14A39A; --t-car:#4F6BE0;
  --t-transport:#0A8FD1; --t-animals:#D9772E; --t-city:#8E5BE0; --t-mod:#67708A; --t-praise:#18A058; --t-other:#8A90A3;
  --heat0:rgba(15,23,42,.05); --heat1:#FFD8A8; --heat2:#FFA26B; --heat3:#F2643F; --heat4:#C8321F;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;
  --font-r:ui-rounded,"SF Pro Rounded",-apple-system,"Inter",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#05070D; --field-a:#1B2E6B; --field-b:#4A1E2A; --field-c:#0E3B33;
  --glass:rgba(28,31,40,.66); --glass-strong:rgba(32,35,46,.92); --hair:rgba(255,255,255,.08); --hair-hi:rgba(255,255,255,.08);
  --fg:#F3F5FA; --fg2:#C4CADA; --muted:#8C93A8; --fill:rgba(255,255,255,.07);
  --accent:#6E95FF; --accent-2:#A58BFF; --accent-soft:rgba(110,149,255,.16);
  --urgent:#FF6E5E; --urgent-soft:rgba(255,110,94,.16); --good:#4CD38A; --good-soft:rgba(76,211,138,.15); --warn:#FFBE4D; --warn-soft:rgba(255,190,77,.15);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --t-road:#C39A70; --t-mod:#99A1B8; --heat0:rgba(255,255,255,.05); --heat1:#5A3A1C; --heat2:#9A4A24; --heat3:#D45A36; --heat4:#FF6E4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#05070D; --field-a:#1B2E6B; --field-b:#4A1E2A; --field-c:#0E3B33;
  --glass:rgba(28,31,40,.66); --glass-strong:rgba(32,35,46,.92); --hair:rgba(255,255,255,.08); --hair-hi:rgba(255,255,255,.08);

  --shadow:0 1px 1px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --t-road:#C39A70; --t-mod:#99A1B8; --heat0:rgba(255,255,255,.05); --heat1:#5A3A1C; --heat2:#9A4A24; --heat3:#D45A36; --heat4:#FF6E4A; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.42 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.field{position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 30% at 18% 12%,var(--field-a),transparent 70%),radial-gradient(34% 28% at 88% 22%,var(--field-b),transparent 70%),radial-gradient(40% 32% at 60% 78%,var(--field-c),transparent 72%);opacity:.9}
@media (prefers-reduced-motion:no-preference){.field{animation:drift 26s ease-in-out infinite alternate}}
@keyframes drift{to{transform:translate3d(3%,-2%,0) scale(1.06)}}
button{font-family:inherit;color:inherit}
.screen{max-width:700px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
@media (prefers-reduced-motion:no-preference){.screen>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}.screen>*:nth-child(2){animation-delay:.04s}.screen>*:nth-child(3){animation-delay:.08s}.screen>*:nth-child(4){animation-delay:.12s}.screen>*:nth-child(5){animation-delay:.16s}}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:8px}
.hdr .eyebrow{font-size:13px;color:var(--muted);font-weight:500}
h1{font:800 34px/1.06 var(--font-d);letter-spacing:-.025em;margin:3px 0 0;text-wrap:balance}
h2{font:600 13px/1.2 var(--font);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 9px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 button{font:600 14px var(--font);text-transform:none;letter-spacing:0;color:var(--accent);background:none;border:0;cursor:pointer;padding:0;margin-right:6px}
h2 button[disabled]{opacity:.4;cursor:default}
.glass{background:var(--glass);backdrop-filter:saturate(1.6) blur(22px);-webkit-backdrop-filter:saturate(1.6) blur(22px);border:1px solid var(--hair);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 var(--hair-hi)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--hair);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:19px;height:19px;stroke:var(--fg2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* hero */
.hero{padding:18px;display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:center}
.gauge{position:relative;width:132px;height:132px}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.gauge b{font:800 38px/1 var(--font-r);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.gauge span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.hero .side{display:flex;flex-direction:column;gap:10px;min-width:0}
.mood{font:700 21px/1.2 var(--font-d);letter-spacing:-.01em}
.mood small{display:block;font:500 13.5px/1.35 var(--font);color:var(--muted);margin-top:3px;letter-spacing:0}
.senti{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--fill)}
.senti i{display:block;height:100%}
.senti-l{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.senti-l span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:0}
@media (max-width:400px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.hero .side{align-items:center}.senti{width:100%}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{border:1px solid var(--hair);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:18px;padding:12px 12px 11px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .15s}
.kpi:active{transform:scale(.97)}
.kpi .k-ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--c)}
.kpi .k-ico svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.kpi b{font:800 26px/1 var(--font-r);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);line-height:1.2;font-weight:500}
@media (max-width:420px){.kpis{grid-template-columns:repeat(2,1fr)}}
/* stories */
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none;margin:0 -2px}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:70px;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0}
.ring{width:64px;height:64px;border-radius:50%;padding:3px;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--fill) 0)}
.ring>div{width:100%;height:100%;border-radius:50%;background:var(--glass-strong);display:grid;place-items:center;position:relative}
.ring svg{width:24px;height:24px;stroke:var(--c);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ring em{position:absolute;right:-4px;bottom:-2px;min-width:22px;height:22px;border-radius:11px;background:var(--c);color:#fff;font:700 12px/22px var(--font-r);font-style:normal;padding:0 6px;border:2px solid var(--bg)}
.story span{font-size:11.5px;line-height:1.15;text-align:center;color:var(--fg2);font-weight:500}
/* brief */
.brief{padding:18px;display:flex;flex-direction:column;gap:12px}
.brief .lbl{display:flex;align-items:center;gap:9px;font:700 16px var(--font-d)}
.ai-dot{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;flex:none}
.ai-dot svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brief .txt{font-size:15.5px;line-height:1.55;white-space:pre-wrap;color:var(--fg)}
.brief .txt.dim{color:var(--muted)}
.brief small{color:var(--muted);font-size:12.5px}
.lnk{display:inline-block;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:999px;text-decoration:none;white-space:nowrap;vertical-align:1px}
.msg.me .lnk{color:#fff;background:rgba(255,255,255,.2)}
.btn{border:0;background:var(--accent);color:var(--on-accent);font:600 15px var(--font);padding:11px 18px;border-radius:14px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;justify-content:center;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.grad{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:var(--fill);color:var(--fg)}
.btn.small{padding:8px 13px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
/* trend cards */
.trends{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.trend{border:1px solid var(--hair);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:18px;padding:12px 13px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0}
.trend .tt{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;min-width:0}
.trend .tt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trend .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.trend .tv{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.trend b{font:800 24px/1 var(--font-r);font-variant-numeric:tabular-nums}
.trend .dl{font:700 12px var(--font-r);padding:2px 6px;border-radius:6px}
.dl.up{color:var(--urgent);background:var(--urgent-soft)} .dl.down{color:var(--good);background:var(--good-soft)} .dl.flat{color:var(--muted);background:var(--fill)}
.spark{width:100%;height:30px;display:block}
.spark path.l{fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark path.a{fill:var(--c);opacity:.14}
.spark circle{fill:var(--c)}
/* lists */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;font:500 14px var(--font);padding:7px 4px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--glass-strong);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--hair);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:7px 13px;font:500 14px var(--font);cursor:pointer;display:flex;gap:7px;align-items:center;white-space:nowrap}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{display:flex;align-items:center;gap:8px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--hair);border-radius:14px;padding:10px 12px}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{border:0;background:transparent;font:16px var(--font);color:var(--fg);flex:1;min-width:0;outline:none}
.day{font:700 13px var(--font);color:var(--muted);padding:12px 16px 4px;text-transform:uppercase;letter-spacing:.06em}
.row{display:grid;grid-template-columns:38px 1fr auto;gap:12px;padding:12px 14px;align-items:start;cursor:pointer;position:relative;transition:background .15s}
.row:hover{background:var(--fill)}
.row + .row::before{content:"";position:absolute;top:0;left:64px;right:0;border-top:1px solid var(--hair)}
.row.seen{opacity:.48}
.row.unseen .t::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:2px}
.ico{width:38px;height:38px;border-radius:12px;background:var(--c);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.ico svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.body{min-width:0;display:flex;flex-direction:column;gap:6px}
.body .t{font-size:15.5px;line-height:1.38;overflow-wrap:anywhere;font-weight:500}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 7px;align-items:center}
.tag{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.tag.urg{background:var(--urgent-soft);color:var(--urgent)}
.tag.men{background:var(--accent-soft);color:var(--accent)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.ins{background:var(--warn-soft);color:var(--warn)}
.tag.q{background:var(--fill);color:var(--fg2)}
.chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;margin-top:10px;opacity:.6}
.empty{padding:28px 18px;color:var(--muted);text-align:center;font-size:15px;line-height:1.5}
.more{display:block;width:100%;padding:13px;border:0;border-top:1px solid var(--hair);background:none;color:var(--accent);font:600 15px var(--font);cursor:pointer}
/* hex map */
.mapwrap{padding:10px 10px 6px;display:flex;justify-content:center}
.mapwrap svg{width:100%;max-width:420px;height:auto;display:block}
.hex{cursor:pointer}
.hex polygon{stroke:var(--bg);stroke-width:3;transition:transform .2s;transform-box:fill-box;transform-origin:center}
.hex:hover polygon{transform:scale(.96)}
.hex.sel polygon{stroke:var(--fg);stroke-width:3}
.hex text{font-family:var(--font);fill:var(--fg);pointer-events:none}
.hex text.n{font:800 20px var(--font-r)}
.hex.hot text{fill:#fff}
.legend{display:flex;justify-content:space-between;align-items:center;padding:0 16px 14px;font-size:12px;color:var(--muted);gap:8px}
.legend .scale{display:flex;gap:3px}
.legend .scale i{width:20px;height:8px;border-radius:3px;background:var(--h)}
/* polls */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;padding:18px 14px 6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod .ico{width:44px;height:44px;border-radius:14px}
.pod span{font-size:12.5px;font-weight:600;line-height:1.2}
.pod .blk{width:100%;border-radius:12px 12px 4px 4px;background:var(--c);opacity:.9;display:grid;place-items:center;color:#fff;font:800 20px var(--font-r)}
.rank{display:flex;flex-direction:column;padding-bottom:4px}
.rk{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:10px 16px}
.rk .n{font:800 15px var(--font-r);color:var(--muted);text-align:center}
.rk .w{min-width:0;display:flex;flex-direction:column;gap:2px}
.rk .w small{color:var(--muted);font-size:12px}
.rk .s{font:700 14px var(--font-r);font-variant-numeric:tabular-nums;color:var(--fg2)}
.poll{padding:18px;display:flex;flex-direction:column;gap:12px}
.poll + .poll{border-top:1px solid var(--hair)}
.poll .q{font:700 18px/1.3 var(--font-d);letter-spacing:-.01em}
.opt{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center}
.opt .ob{position:relative;border-radius:12px;background:var(--fill);padding:10px 12px;font-size:15px;overflow:hidden;min-width:0;display:flex;justify-content:space-between;gap:8px}
.opt .ob i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent-soft),var(--accent-soft));border-radius:12px;transition:width .4s}
.opt .ob span,.opt .ob b{position:relative}
.opt .ob b{font:700 14px var(--font-r)}
.opt input{width:100%;border:1px solid var(--hair);border-radius:10px;padding:9px 8px;font:15px var(--font-r);background:var(--glass-strong);color:var(--fg);text-align:right}
.status{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--fill);white-space:nowrap}
.status.postat{background:var(--accent-soft);color:var(--accent)}
.status.inchis{background:var(--good-soft);color:var(--good)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:11px 14px;border-radius:20px;font-size:15.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--glass-strong);border:1px solid var(--hair);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.msg.ai.dim{color:var(--muted)}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sug{border:1px solid var(--hair);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;padding:12px;text-align:left;font:500 14px/1.35 var(--font);cursor:pointer;box-shadow:var(--shadow)}
.sug b{display:block;font-size:12px;color:var(--accent);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
@media (max-width:400px){.sugg{grid-template-columns:1fr}}
.composer{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));z-index:15}
.composer form{max-width:700px;margin:0 auto;display:flex;gap:8px;background:var(--glass-strong);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--hair);border-radius:26px;padding:5px 5px 5px 16px;box-shadow:var(--shadow)}

 const days=Math.floor(diff/24);if(days===1)return"ieri";if(days<7)return`acum ${days} zile`;

function tension(){
 const d1=recent(24),wk=recent(24*7);
 const w=p=>(p.flags?.urgent?3:0)+(p.flags?.insult?3:0)+(isMention(p)?1:0)+(COMPLAINT.includes(p.theme)?1:0);
 const days=new Set(wk.map(p=>new Date(ts(p)).toDateString())).size;
 const today=d1.reduce((s,p)=>s+w(p),0),avg=wk.reduce((s,p)=>s+w(p),0)/Math.max(3,days);
 /* saturating scale: an average day ≈ 40, double ≈ 63, triple ≈ 78; never pins at 100 */
 let v=avg?Math.round(100*(1-Math.exp(-today/(2*avg)))):(today?40:0);v=Math.max(0,Math.min(99,v));
 const lbl=v<25?["Liniște","Puține reclamații, nimic urgent."]:v<50?["Normal","Reclamații obișnuite pentru o zi."]:v<75?["Agitat","Mai multe reclamații decât de obicei."]:["Fierbinte","Multe reclamații, urgențe sau atacuri azi."];
 const col=v<25?"var(--good)":v<50?"var(--accent)":v<75?"var(--warn)":"var(--urgent)";
 return{v,lbl,col}}

function hexMap(byArea,maxA){
 const R=46,W=Math.sqrt(3)*R,pad=6;
 const heat=n=>!n?"--heat0":n/maxA>.75?"--heat4":n/maxA>.5?"--heat3":n/maxA>.25?"--heat2":"--heat1";
 const pts=(cx,cy)=>Array.from({length:6},(_,i)=>{const a=Math.PI/180*(60*i-30);return(cx+R*Math.cos(a)).toFixed(1)+","+(cy+R*Math.sin(a)).toFixed(1)}).join(" ");
 const vw=W*3.5+pad*2,vh=R*1.5*4+R*2+pad*2;

function pollResults(L,jump){

 if(!N)return`<div class="glass"><div class="empty">Nicio problemă semnalată în perioada aleasă.</div></div>`;
 const T=Object.entries(themeCounts(P)).sort((a,b)=>b[1]-a[1]),pct=n=>Math.round(n/N*100);
 const ac={};P.forEach(p=>{if(!p.area)return;(ac[p.area]=ac[p.area]||[]).push(p)});
 const A=Object.entries(ac).sort((a,b)=>b[1].length-a[1].length).slice(0,6),amax=A[0]?.[1].length||1;
 return`<div class="glass baro">
  <div class="baro-h"><b>${N}</b><span>${N===1?"problemă semnalată":"probleme semnalate"}. Fiecare postare contează ca un vot.</span></div>
  <div class="stack" role="img" aria-label="Împărțirea pe teme">${T.map(([k,n])=>`<i style="width:${n/N*100}%;background:var(${THEMES[k].c})"></i>`).join("")}</div>

  ${A.length?`<div class="where"><div class="wh-t">Unde</div>${A.map(([a,l])=>{const t=Object.entries(themeCounts(l)).sort((x,y)=>y[1]-x[1])[0][0];return`<div class="wh"><span class="wh-n">${esc(AREA_N[a])}</span><span class="wh-b"><i style="width:${l.length/amax*100}%;background:var(${THEMES[t].c})"></i></span><span class="wh-v">${l.length}<small> · mai ales ${THEMES[t].n.toLowerCase()}</small></span></div>`}).join("")}${P.filter(p=>!p.area).length?`<div class="meta">${P.filter(p=>!p.area).length} fără cartier clar</div>`:""}</div>`:""}
 </div>`}

/* ---------- „Preia date acum” ---------- */
const hm=iso=>new Date(iso).toLocaleTimeString("ro-RO",{hour:"2-digit",minute:"2-digit"});
function reqCard(scope){
 const r=S.req,lr=S.runs[0];
 const busy=r&&(r.status==="cerut"||r.status==="in_lucru")&&NOW()-Date.parse(r.at)<3*36e5;
 let line=lr?`Ultima citire: ${when(lr.at)}${lr.relevant!=null?` · ${lr.relevant} postări noi`:""}`:"Nicio citire încă";
 if(r&&r.status==="cerut"&&busy)line=`Cerere trimisă la ${hm(r.at)}. Pornește în cel mult 30 de minute.`;
 if(r&&r.status==="in_lucru"&&busy)line=`Se citește acum (pornit la ${hm(r.startedAt||r.at)}). Postările noi apar singure aici.`;
 if(r&&r.status==="gata"&&r.doneAt&&NOW()-Date.parse(r.doneAt)<6*36e5)line=`Actualizat la ${hm(r.doneAt)}${r.found!=null?` · ${r.found} postări noi`:""}.`;
 return`<section class="glass reqcard"><div class="rq-t"><span class="rq-dot${busy?" on":""}"></span><span>${line}</span></div>
  <button class="btn ${busy?"plain":"grad"} small" data-act="reqNow" data-scope="${scope}" ${busy||!canWrite?"disabled":""}>${svg(I.today)}${busy?(r.status==="in_lucru"?"Se citește…":"Cerere trimisă"):"Preia date acum"}</button></section>`}
async function reqNow(scope){
 await dbWrite(()=>db.doc("requests/now").set({status:"cerut",scope,at:new Date().toISOString()}),"Cererea nu s-a trimis.");
 toast("Am trimis cererea. Citirea pornește în cel mult 30 de minute.")}

const AP_CAT={drumuri:["Drumuri","--t-road"],salubritate:["Salubritate","--t-trash"],arbori:["Arbori","--t-park"],verzi:["Spații verzi","--t-praise"],parcari:["Parcări","--t-car"],caini:["Câini","--t-animals"],pisici:["Pisici","--t-animals"],joaca:["Locuri de joacă","--t-light"],mobilierurban:["Mobilier urban","--t-city"],cismele:["Cișmele","--t-transport"],toalete:["Toalete","--t-transport"],altele:["Altele","--t-other"]};
const AP_ST={trimisa:["Nouă","--accent"],preluata:["În lucru","--warn"],rezolvata:["Soluționată","--good"],inchisa:["Închisă","--muted"]};
const apCat=c=>AP_CAT[c]||[c||"Altele","--t-other"];
const apOpen=x=>x.s==="trimisa"||x.s==="preluata";
const apLate=x=>apOpen(x)&&x.te&&x.te<NOW();
const normStreet=s=>{s=String(s||"").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/,.*$/,"").replace(/\bnr\.?\s*\S+.*$/,"").replace(/^(strada|str\.?|bulevardul|bd\.?|b-dul|soseaua|sos\.?|calea|aleea|intrarea|piata|splaiul|drumul|fundatura|prelungirea)\s+/,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();return s};
function apItems(){return S.apItems||[]}
/* fundal: hartă statică OpenStreetMap a Sectorului 1 (harta-sector1.jpg, zoom 14, proiecție Web Mercator) */
const MAPBG={lat0:44.428,lat1:44.545,lon0:26.000,lon1:26.120,w:900,h:1229};
const _mx=lon=>(lon+180)/360,_my=lat=>{const r=lat*Math.PI/180;return(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2};
function apXY(la,lo){const x0=_mx(MAPBG.lon0),x1=_mx(MAPBG.lon1),y0=_my(MAPBG.lat1),y1=_my(MAPBG.lat0);return[(_mx(lo)-x0)/(x1-x0)*MAPBG.w,(_my(la)-y0)/(y1-y0)*MAPBG.h]}
function apMap(L){
 const P=L.filter(x=>x.la&&x.lo);
 const dots=P.map(x=>{const[,c]=apCat(x.c),[cx,cy]=apXY(x.la,x.lo);const late=apLate(x);return`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${late?13:10}" fill="var(${c})" class="${apOpen(x)?"op":"cl"}${late?" late":""}${S.apSel===x.r?" sel":""}" data-apref="${esc(x.r)}"><title>${esc(x.i)} · ${esc(x.a||"")}</title></circle>`}).join("");
 return`<svg class="apmap" viewBox="0 0 ${MAPBG.w} ${MAPBG.h}" role="img" aria-label="Harta sesizărilor din Sectorul 1"><image href="harta-sector1.jpg" x="0" y="0" width="${MAPBG.w}" height="${MAPBG.h}" class="ap-bg"/>${dots}<text x="${MAPBG.w-8}" y="${MAPBG.h-10}" text-anchor="end" class="ap-attr">© OpenStreetMap</text></svg>${P.length?"":'<div class="empty">Nicio sesizare cu poziție pentru filtrul ales.</div>'}`}
function apCard(x){if(!x)return"";const[cn,cc]=apCat(x.c),[sn,sc]=AP_ST[x.s]||[x.s,"--muted"];
 return`<div class="glass apcard"><div class="apc-h"><span class="tag" style="background:var(${cc});color:#fff">${esc(cn)}</span><span class="tag" style="color:var(${sc});background:var(--fill)">${esc(sn)}</span>${apLate(x)?'<span class="tag urg">Termen depășit</span>':""}<span class="meta">${esc(x.r)}</span></div>
  <b>${esc(x.i||"")}</b><div class="meta">${esc(x.a||"")}${x.kn?" · "+esc(x.kn):""} · ${when(new Date(x.t).toISOString())}${x.ei?" · trimisă la "+esc(x.ei):""}${x.te?" · termen "+new Date(x.te).toLocaleDateString("ro-RO",{day:"numeric",month:"short"}):""}${x.cl?" · rezolvată în "+Math.max(1,Math.round((x.cl-x.t)/DAY))+" zile":""}</div>

  <div class="chips" style="margin-top:10px" role="group" aria-label="Stare">${[["toate","Toate"],["deschise","Deschise"],["intarziate","Termen depășit"],["rezolvate","Rezolvate"]].map(([k,n])=>`<button class="chip" data-apst="${k}" aria-pressed="${stf===k}">${n}</button>`).join("")}</div>

document.addEventListener("click",async e=>{
 const op=e.target.closest("[data-open]");if(op){openSheet(op.dataset.open);return}

 const hx=e.target.closest(".hex");if(hx){S.area=S.area===hx.dataset.area?null:hx.dataset.area;S.limit=40;render();return}

 if(d.apper){S.apPer=+d.apper;render();return}
 if(d.apcat!==undefined){S.apCatF=d.apcat;render();return}
 if(d.apst){S.apStF=d.apst;S.tab="aproape";render();return}
 if(d.gview||d.gper||d.gstatus!==undefined||d.gtheme!==undefined||d.gq||d.gpollper){

  if(d.gq){S.gQ=d.gq;S.gStatus="";S.gTheme="";S.grupView="sesizari"}
  S.tab="grup";render();return}
 if(d.genper){S.genPer=+d.genper;render();return}
 if(d.genscope){S.genScope=d.genscope;render();return}
 if(d.presaper){S.presaPer=+d.presaper;render();return}
 if(d.presaf!==undefined){S.presaF=d.presaf;S.tab="presa";render();return}
 if(d.presaq){S.presaQ=S.presaQ===d.presaq?"":d.presaq;render();return}
 if(d.srczone){const s=S.sources.find(x=>x.id===d.srczone);if(s)await dbWrite(()=>db.collection("sources").doc(s.id).update({zone:s.zone==="presa"?"online":"presa"}),"Nu s-a salvat.");return}
 if(inSes()){
  if(d.sestab==="main"){history.pushState("",document.title,location.pathname+location.search);S.sesTab="rez";render();scrollTo(0,0);return}
  if(d.sestab||d.sesstatus!==undefined||d.sestheme!==undefined||d.theme!==undefined||d.areajump||d.findkw||d.seslistper){
   if(d.sesstatus!==undefined)S.sesStatus=d.sesstatus;
   if(d.sestheme!==undefined)S.sesTheme=S.sesTheme===d.sestheme?"":d.sestheme;
   if(d.theme!==undefined&&!d.sestheme){S.sesTheme=d.theme||"";S.sesTab="lista"}
   if(d.areajump){S.sesArea=d.areajump;S.sesTab="lista"}
   if(d.findkw){S.sesQ=d.findkw;S.sesTab="lista"}
   if(d.seslistper)S.sesListPer=+d.seslistper;
   if(d.sesper&&d.sestab==="lista")S.sesListPer=+d.sesper;
   if(d.sestab){if(d.sestab!==S.sesTab&&!d.sesstatus&&!d.sesper){S.sesStatus="";S.sesTheme="";S.sesArea="";S.sesQ=""}S.sesTab=d.sestab;scrollTo(0,0)}
   render();return}
  if(d.act==="sesClear"){S.sesStatus="";S.sesTheme="";S.sesArea="";S.sesQ="";render();return}
 }
 if(d.tab){S.tab=d.tab;S.settings=false;S.limit=40;S.sheet=null;try{localStorage.setItem("ms1-tab",d.tab)}catch(_){}render();scrollTo(0,0);return}
 if(d.go){S.tab=d.go;S.settings=false;S.limit=40;if(d.urg){S.urgOnly=true;S.theme=null;S.area=null}if(d.men)S.menFilter=d.men;render();scrollTo(0,0);return}

 if(d.men){S.menFilter=d.men;render();return}
 if(d.ask){ask(d.ask);return}

 if(d.findkw){S.q=d.findkw;S.theme=null;S.area=null;S.urgOnly=false;S.tab="probleme";S.settings=false;render();scrollTo(0,0);return}
 if(d.delsrc){if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Sigur? Apasă din nou";setTimeout(()=>{if(b.isConnected){b.textContent="Șterge";b.dataset.confirm=""}},3000);return}
  const s=S.sources.find(x=>x.id===d.delsrc);await dbWrite(()=>db.collection("sources").doc(d.delsrc).delete(),"Sursa nu s-a șters.");toast(`„${s?s.name:"Sursa"}” scoasă`);return}
 if(d.settab&&!d.act){S.setTab=d.settab;render();return}
 if(d.sesper){S.sesPer=+d.sesper;render();return}
 if(d.areajump){S.area=d.areajump;S.theme=null;S.urgOnly=false;S.q="";S.tab="probleme";render();scrollTo(0,0);return}
 if(d.act==="sesReport"){makeSesReport(b);return}
 const act=d.act;
 if(act==="reqNow"){reqNow(d.scope||"tot");return}
 if(act==="closeSheet"){S.sheet=null;renderSheet();return}
 if(act==="toggleSeen"){const id=S.sheet;seen[id]?delete seen[id]:seen[id]=1;saveSeen();render();return}
 if(act==="copyLink"){const p=S.posts.find(x=>x.id===S.sheet);try{await navigator.clipboard.writeText(p.url);toast("Link copiat")}catch(_){toast("Nu am putut copia")}return}
 if(act==="askAbout"){const p=S.posts.find(x=>x.id===S.sheet);S.sheet=null;S.tab="ai";render();ask(`Spune-mi mai multe despre asta și ce aș putea face: „${p.summary}” (${p.src}, ${AREA_N[p.area]||"loc neclar"})`);return}
 if(act==="more"){S.limit+=40;render();return}
 if(act==="settings"){S.settings=true;if(d.settab)S.setTab=d.settab;render();scrollTo(0,0);return}
 if(act==="closeSettings"){S.settings=false;render();return}
 if(act==="clearArea"){S.area=null;render();return}
 if(act==="brief"){makeBrief(b);return}
 if(act==="newPoll"){newPoll(b);return}
 const pc=b.closest("[data-poll]");if(!pc)return;const poll=S.polls.find(p=>p.id===pc.dataset.poll);if(!poll)return;
 if(act==="copyPoll"){const txt=poll.q+"\n"+poll.options.map(o=>"• "+o.t).join("\n");try{await navigator.clipboard.writeText(txt);toast("Sondaj copiat")}catch(_){const r=document.createRange();r.selectNodeContents(pc.querySelector(".q"));getSelection().removeAllRanges();getSelection().addRange(r);toast("Textul e selectat. Copiază-l.")}return}
 if(act==="pollStatus"){const nx=poll.status==="postat"?"inchis":"postat";await dbWrite(()=>db.collection("polls").doc(poll.id).update({status:nx}),"Starea sondajului nu s-a salvat.");return}
 if(act==="delPoll"){if(pc.dataset.confirm!=="1"){pc.dataset.confirm="1";b.textContent="Sigur? Apasă din nou";setTimeout(()=>{if(b.isConnected){b.textContent="Șterge";pc.dataset.confirm=""}},3000);return}await dbWrite(()=>db.collection("polls").doc(poll.id).delete(),"Sondajul nu s-a șters.");toast("Sondaj șters");return}
});
function liveInput(e,setter,sel){setter(e.target.value);clearTimeout(S._qt);S._qt=setTimeout(()=>{const pos=e.target.selectionStart;render();const q=document.querySelector(sel);if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}},250)}
document.addEventListener("input",e=>{const t=e.target;
 if(t.id==="q")liveInput(e,v=>S.q=v,"#q");
 else if(t.id==="gQ")liveInput(e,v=>S.gQ=v,"#gQ");
 else if(t.id==="presaQ")liveInput(e,v=>S.presaQ=v,"#presaQ");
 else if(t.id==="sesQ")liveInput(e,v=>S.sesQ=v,"#sesQ");
 else if(t.id==="srcQ")liveInput(e,v=>S.srcQ=v,"#srcQ");
 else if(t.dataset.kwq)liveInput(e,v=>S.kwQ[t.dataset.kwq]=v,`[data-kwq="${t.dataset.kwq}"]`);
});
document.addEventListener("change",async e=>{const v=e.target.dataset.vote;if(v===undefined)return;const pc=e.target.closest("[data-poll]");const poll=S.polls.find(p=>p.id===pc.dataset.poll);if(!poll)return;
 const opts=poll.options.map((o,i)=>i===+v?{...o,votes:Math.max(0,parseInt(e.target.value)||0)}:o);await dbWrite(()=>db.collection("polls").doc(poll.id).update({options:opts}),"Voturile nu s-au salvat.")});
document.addEventListener("submit",async e=>{e.preventDefault();
 if(e.target.id==="askForm"){const i=document.getElementById("askInput");const q=i.value.trim();if(q){i.value="";ask(q)}}
 if(e.target.id==="srcForm"){const u=document.getElementById("srcUrl").value,n=document.getElementById("srcName").value,z=document.getElementById("srcZone").value;await addSource(u,n,z);return}
 if(e.target.dataset.kwadd){const ta=e.target.querySelector("textarea");const v=ta.value;ta.value="";await addKeywords(e.target.dataset.kwadd,v);return}
 if(e.target.id==="kwForm"){const w=document.getElementById("kwIn").value.trim(),t=document.getElementById("kwType").value;if(!w)return;
  if(S.config.keywords.some(k=>k.w.toLowerCase()===w.toLowerCase())){toast("Cuvântul există deja");return}
  await dbWrite(()=>db.doc("config/main").update({keywords:[...S.config.keywords,{w,type:t}]}),"Cuvântul nu s-a salvat.");toast("Adăugat. Contează de la următoarea citire.")}
});
async function dbWrite(fn,err){if(!db||!canWrite){toast("Doar proprietarul poate schimba asta");return}try{await fn()}catch(x){toast(err)}}
async function delKeyword(cat,w){const words=kwList(cat).filter(x=>x!==w);await dbWrite(()=>db.collection("kwlists").doc(cat).update({words}),"Nu s-a șters.");toast(`„${w}” scos`)}
async function addKeywords(cat,raw){
 const add=raw.split(/[\n,;]+/).map(x=>x.trim().replace(/\s+/g," ")).filter(x=>x.length>1);if(!add.length)return;
 const cur=kwList(cat),low=new Set(cur.map(x=>x.toLowerCase()));const fresh=[...new Set(add)].filter(x=>!low.has(x.toLowerCase()));
 if(!fresh.length){toast("Există deja");return}
 const c=KW_CATS.find(x=>x.id===cat);
 const exists=S.kwlists.some(k=>k.id===cat);
 await dbWrite(()=>exists?db.collection("kwlists").doc(cat).update({words:[...cur,...fresh]}):db.collection("kwlists").doc(cat).set({label:c.label,kind:c.kind,order:KW_CATS.indexOf(c),words:[...cur,...fresh]}),"Nu s-a salvat.");
 toast(fresh.length===1?`„${fresh[0]}” adăugat`:`${fresh.length} cuvinte adăugate`)}
async function addSource(url,name,zone){
 let u;try{u=new URL(url.trim())}catch(_){toast("Link-ul nu pare bun. Lipește adresa întreagă, cu https://");return}
 if(u.protocol!=="https:"&&u.protocol!=="http:"){toast("Link-ul trebuie să înceapă cu https://");return}
 u.hash="";const pid=u.searchParams.get("id");const clean=u.hostname.includes("facebook.com")?(/profile\.php/.test(u.pathname)?(pid?"https://www.facebook.com/profile.php?id="+pid:""):"https://www.facebook.com"+u.pathname.replace(/\/$/,"")+"/"):u.origin+u.pathname+u.search;
 if(!clean){toast("Link-ul de profil e incomplet. Copiază-l întreg, cu „?id=…” la final.");return}
 if(S.sources.some(s=>s.url.replace(/\/$/,"")===clean.replace(/\/$/,""))){toast("Sursa e deja în listă");return}
 const type=srcType(clean);
 const nm=name.trim()||(type==="site"?u.hostname.replace(/^www\./,""):pid?"Pagina "+pid:decodeURIComponent(u.pathname.split("/").filter(Boolean).pop()||u.hostname));
 const id=(type==="grup"?"g-":type==="pagina"?"p-":"s-")+clean.replace(/^https?:\/\/(www\.)?/,"").replace(/[^A-Za-z0-9_-]+/g,"_").slice(0,120);
 await dbWrite(()=>db.collection("sources").doc(id).set({name:nm.slice(0,120),type,url:clean,zone:type==="site"?"presa":(zone||"online"),active:true,manual:true,order:500+S.sources.length,addedAt:new Date().toISOString()}),"Sursa nu s-a salvat.");
 toast(`Adăugat: ${nm} (${SRC_LABEL[type]})`)}
async function toggleSource(id){const s=S.sources.find(x=>x.id===id);if(!s)return;await dbWrite(()=>db.collection("sources").doc(id).update({active:s.active===false}),"Nu s-a salvat.")}

/* ---------- AI ---------- */
function corpus(limit=260){
 return S.posts.slice().sort((a,b)=>ts(b)-ts(a)).slice(0,limit).map(p=>{const f=p.flags||{};return[new Date(ts(p)).toISOString().slice(0,16).replace("T"," "),p.src,AREA_N[p.area]||"",THEMES[tkey(p)].n,[isMention(p)?"mențiune":"",f.urgent?"urgent":"",f.insult?"jignire":"",f.positive?"laudă":""].filter(Boolean).join("/"),p.summary,p.url].join(" | ")}).join("\n")}
const SYS=()=>`Ești asistentul unui consilier local din Sectorul 1 București (Ion Enache). Răspunzi în română, simplu, fără jargon, scurt și la obiect. Folosești DOAR postările de mai jos (adunate din grupuri Facebook, pagini și presă). Dacă nu găsești ceva în ele, spui clar că nu apare. Nu inventa străzi, cifre sau citate. Nu numi persoanele private care au scris. Când e util, dă link-ul postării. Data de azi: ${new Date().toLocaleDateString("ro-RO",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}.\n\nPOSTĂRI (dată | sursă | cartier | temă | semnale | rezumat | link):\n${corpus()}`;
async function ask(q){
 if(!sample){toast("Asistentul merge doar deschis din Claude");return}
 S.chat.push({r:"u",t:q});const a={r:"a",t:"Mă gândesc…",dim:true};S.chat.push(a);render();
 const msgs=[{role:"user",content:SYS()+"\n\nÎNTREBARE: "+S.chat[0].t}];
 S.chat.slice(1,-1).forEach(m=>msgs.push({role:m.r==="u"?"user":"assistant",content:m.t}));
 if(msgs.length%2===0)msgs.push({role:"user",content:q});
 try{const r=await sample(msgs,{cache:false,onText:({text})=>{a.t=text;a.dim=false;const el=document.querySelector("#chat .msg:last-child");if(el){el.textContent=text;el.classList.remove("dim")}}});a.t=r.text;a.dim=false}
 catch(x){a.t=x&&x.code==="rate_limited"?"Prea multe întrebări într-un timp scurt. Încearcă peste un minut.":x&&x.code==="not_granted"?"Asistentul nu are permisiune în această pagină.":"Nu am putut răspunde acum. Încearcă din nou.";a.dim=true}
 render()}
async function makeBrief(b){
 if(!sample)return;b.disabled=true;b.lastChild.textContent="Citesc…";const el=document.getElementById("briefTxt");
 try{const r=await sample(SYS()+`\n\nScrie rezumatul zilei pentru consilier: maximum 5 rânduri scurte, fiecare începe cu „• ”. Întâi ce îl privește direct (mențiuni, jigniri), apoi urgențele, apoi tema care crește cel mai mult, apoi un lucru bun. Fiecare rând max 2 propoziții. Pune cel mult un link pe rând, la final, fără paranteze. Fără introducere.`,{onText:({text})=>{if(el){el.textContent=text;el.classList.remove("dim")}}});
  const doc={text:r.text,at:new Date().toISOString()};S.brief=doc;if(db&&canWrite){try{await db.doc("briefs/latest").set(doc)}catch(_){}}render()}
 catch(x){toast(x&&x.code==="rate_limited"?"Încearcă peste un minut":"Rezumatul nu a mers acum");b.disabled=false;b.lastChild.textContent="Fă rezumatul"}}
function sesCorpus(days=14){return S.posts.filter(isSes).filter(p=>NOW()-ts(p)<days*DAY).sort((a,b)=>ts(b)-ts(a)).map(p=>[new Date(ts(p)).toISOString().slice(0,10),AREA_N[p.area]||"",THEMES[tkey(p)].n,p.status||"nou",p.summary,p.cmt?"Comentarii: "+p.cmt:"",(p.kw||[]).join(", "),p.url].join(" | ")).join("\n")}
async function newPoll(b){
 if(!sample||!db)return;const ses=b.dataset.scope==="sesizari";const label=b.textContent;b.disabled=true;b.textContent="Gândesc…";
 const R=rankThemes().slice(0,6).map(r=>`${THEMES[r.k].n}: ${r.n} postări, cartiere: ${r.areas.map(a=>AREA_N[a]).join(", ")||"diverse"}`).join("\n");
 const prev=S.polls.map(p=>p.q).join("\n");
 const ctx=ses?`Ești asistentul consilierului local Ion Enache, administrator al grupului Facebook „Sesizări Sector 1” (~20.000 de membri). Răspunzi în română.\n\nSESIZĂRILE DIN GRUP, ULTIMELE 14 ZILE (dată | cartier | temă | stare | rezumat | comentarii | cuvinte | link):\n${sesCorpus()}`:SYS()+`\n\nCLASAMENT PROBLEME:\n${R}`;
 const ask=ses?`Propune UN sondaj pentru membrii grupului „Sesizări Sector 1”, făcut DOAR din problemele de mai sus, ca să afle ce vor rezolvat primul. Folosește locurile și problemele reale (străzi, cartiere). Întrebare scurtă, neutră, fără partizanat. 3-5 variante clare. Răspunde DOAR JSON: {"q":"...","options":["..."],"why":"o frază: din ce sesizări vine"}`:`Propune UN sondaj nou pentru grupurile de Facebook din Sector 1, ca să afle consilierul ce problemă contează cel mai mult. Întrebare scurtă, neutră, fără partizanat. 3-5 variante clare. Răspunde DOAR JSON: {"q":"...","options":["..."],"why":"o frază: de ce acum"}`;
 try{const j=await sample.json(ctx+`\n\nSONDAJE DEJA FĂCUTE:\n${prev||"niciunul"}\n\n`+ask,{modelTier:"quick"});
  if(!j||!j.q||!Array.isArray(j.options))throw 0;
  await db.collection("polls").add({q:String(j.q).slice(0,200),options:j.options.slice(0,5).map(t=>({t:String(t).slice(0,80),votes:0})),why:String(j.why||"").slice(0,200),status:"propus",group:ses?"sesizari":"general",createdAt:new Date().toISOString()});toast("Sondaj propus")}
 catch(x){toast("Nu am putut propune acum")}
 b.disabled=false;b.textContent=label}
async function makeSesReport(b){
 if(!sample)return;const label=b.lastChild.textContent;b.disabled=true;b.lastChild.textContent="Citesc grupul…";const el=document.getElementById("sesTxt");
 const L=S.posts.filter(isSes).filter(p=>NOW()-ts(p)<7*DAY);
 try{const r=await sample(`Ești asistentul consilierului local Ion Enache, administrator al grupului Facebook „Sesizări Sector 1”. Scrie raportul zilei despre grup, în română simplă, fără introducere, cu titluri scurte pe rând separat:\nCe zic oamenii: 2-3 rânduri despre starea de spirit.\nProblemele principale: 3-5 puncte „• temă – unde – câte sesizări”.\nCe s-a rezolvat sau a fost preluat: 1-2 puncte.\nCe rămâne fără răspuns: 1-3 puncte, cele mai vechi întâi.\nCe ai putea face azi: 2 acțiuni concrete.\nNu numi persoanele private. Folosește DOAR datele de mai jos. Cel mult un link pe punct, la final.\n\nSESIZĂRI (dată | cartier | temă | stare | rezumat | comentarii | cuvinte | link):\n${sesCorpus(7)}`,{onText:({text})=>{if(el){el.textContent=text;el.classList.remove("dim")}}});
  const today=new Date().toISOString().slice(0,10);const doc={date:today,text:r.text,total:L.length,at:new Date().toISOString(),by:"aplicatie"};
  if(db&&canWrite){try{await db.collection("daily").doc(today).set(doc)}catch(_){}}else{S.daily=[doc,...S.daily];render()}}
 catch(x){toast(x&&x.code==="rate_limited"?"Încearcă peste un minut":"Raportul nu a mers acum")}

ype": "site", "url": "https://buletin.de/bucuresti/tag/sector-1/", "order": 121, "active": true, "lastRead": "2026-11-26T17:38:00.000Z", "signal": "semnal mare"}, {"id": "s-primaria-s1-comunicate", "name": "Primăria Sector 1 – comunicate", "type": "site", "url": "https://primariasector1.ro/sectiunea/comunicate-de-presa/", "zone": "presa", "order": 124, "active": true, "lastRead": "2026-11-26T17:38:00.000Z", "signal": "semnal mare"}, {"id": "s-stiripesurse", "name": "Știri pe surse – București", "type": "site", "url": "https://www.stiripesurse.ro/stiri-din-bucuresti", "order": 120, "active": true, "lastRead": "2026-11-26T17:38:00.000Z", "signal": "semnal mare"}], "polls": [{"createdAt": "2026-11-25T05:20:00.000Z", "group": "sesizari", "options": [{"t": "Iluminatul public", "votes": 0}, {"t": "Gropile din asfalt", "votes": 0}, {"t": "Câinii fără stăpân", "votes": 0}, {"t": "Lipsa băncilor și a mobilierului urban", "votes": 0}, {"t": "Copacii și parcurile", "votes": 0}, {"t": "Gunoiul", "votes": 0}], "q": "Care e cea mai mare problemă pe strada ta?", "status": "propus", "why": "din sesizările grupului", "id": "ses-2026-11-25"}], "daily": [{"at": "2026-11-26T11:45:00.000Z", "by": "citire detaliata 13:00", "comments": 4, "date": "2026-11-26", "poll": {"options": ["Mașini parcate care blochează străzile", "Marcaje și treceri de pietoni", "Siguranța în parcuri seara", "Copaci periculoși", "Traficul pe străzile mici"], "q": "Ce problemă din cartierul tău ar trebui rezolvată prima?"}, "text": "Ce zic oamenii:\nVecinii din Bucureștii Noi revin cu probleme vechi (parcarea care blochează str. Episcopul Vulcan, traficul de pe str. Străbună – 3 luni fără răspuns). La Piața Floreasca stâlpișorii remontați au păreri împărțite, iar alții cer la fel pe str. Cornescu. Aseară, postarea despre Parcul Bazilescu (persoane sub influența drogurilor, un cuțit) a strâns cele mai multe reacții (160+).\n\nProblemele principale:\n• Parcare și trafic blocat – Bucureștii Noi (Episcopul Vulcan, Străbună) – 2\n• Marcaje și trecere de pietoni degradate – Bd. Bucureștii Noi / Șos. Chitilei / Str. Timișului – 1\n• Copac cu risc de prăbușire – Str. Fruntașului – 1\n• De aseară: siguranță în Parcul Bazilescu, cameră controversată pe Mănăstirea Dealu, construcție fără panou pe Bd. Poligrafiei 77\n\nCe s-a rezolvat sau a fost preluat:\n• Stâlpișori anti-parcare remontați la Piața Floreasca\n• Camera de pe Mănăstirea Dealu – ai explicat că e camera primăriei pe domeniul public\n\nCe rămâne fără răspuns:\n• Str. Străbună – trafic de dimineață\n• Str. Episcopul Vulcan – problema revine, vecinii spun că durează de 6 ani\n• Parcul Bazilescu – cerere de controale ale Poliției Locale\n• Trecerea pe sub Podul Constanța – plasa de protecție scoasă\n\nCe ai putea face azi:\n• Cere Poliției Locale patrule seara în Parcul Bazilescu și răspunde în grup\n• Trimite la ADP/DUPSPM copacul de pe str. Fruntașului (risc înainte de ninsoare)\n• Aprobă și răspunde la revenirea despre str. Străbună\n• Întreabă de autorizația construcției de pe Bd. Poligrafiei 77", "total": 5, "id": "2026-11-26"}, {"at": "2026-11-25T17:52:00.000Z", "by": "citire detaliata la cerere (18:00 UTC)", "comments": 15, "date": "2026-11-25", "poll": {"options": ["Gropile din asfalt și trotuarele stricate", "Frunzele și gunoiul", "Mașinile parcate pe trotuar", "Iluminatul public", "Siguranța pietonilor la traversări"], "q": "Care e cea mai mare problemă pe strada ta?"}, "text": "Ce zic oamenii:\nSeara au venit multe sesizări noi. La Piața Domenii vecinii confirmă că trotuarele de pe partea cu Luca sunt impracticabile de mult din cauza lucrărilor și cer amenzi pentru constructor; aceeași problemă e semnalată la Liceul Nicolae Iorga și în zona 1 Mai–Expoziției. La intersecția Mureș–Mircești, Ion Enache a explicat că e un proiect de resistematizare a zonei, iar vecinii cer și o cișmea în parc. La anunțul cu restricțiile de 1 Decembrie, locuitorii din zona 1 Mai/Clucerului se plâng că acum restricțiile durează 3 zile. La postarea primarului „Din teren” oamenii laudă strângerea frunzelor, dar cer refacerea Str. Natației (Dămăroaia) și o cale de acces pentru cartierul Pădurea Băneasa.\n\nProblemele principale:\n• Curățenie și gunoi – gunoiul ridicat la ora școlii pe Str. Ivan Petrovici Pavlov, noroiul Romprest la Băiculești–Străulești, platformele din stația Nicolae Titulescu, un punct de gunoi fără cameră – 4\n• Trotuare și gropi – Piața Domenii (trotuare blocate de lucrări), Str. Parcului, Str. Paharnicului – 3\n• Siguranță – ușa ANAF de pe Str. Berna cu încuietori rupte, panou Parking București prea jos pe Str. Sfinții Voievozi 62, traversare periculoasă sub Podul Constanța – 3\n• Iluminat – Str. Roma (Washington – Piața Dorobanți) fără lumină de peste două săptămâni; Bd. Mihalache fără iluminat festiv – 2\n• Lucrări în oraș – intersecția Mureș–Mircești, anunțul primarului „Din teren” – 2\n• Altele – copac netoaletat la un loc de parcare pe Str. Lainici, restricții de 1 Decembrie, țarcul de câini din Pajura, mașină pe trotuar la trecere – 4\n\nCe s-a rezolvat sau a fost preluat:\n• Preluate: groapa de pe Str. Paharnicului colț cu Pivnicerului; întrebarea despre lucrările de la Mureș–Mircești (răspuns Ion Enache).\n•.\n\nCe rămâne fără răspuns:\n• Trotuarele de la Piața Domenii – revin, mulți vecini afectați, risc pentru cărucioare.\n• Str. Roma fără iluminat de două săptămâni și Str. Parcului cu gropi – fără răspuns oficial.\n• Ușa ANAF de pe Str. Berna și panoul prea jos de pe Sfinții Voievozi – risc de accident, fără răspuns.\n\nCe ai putea face azi:\n• Cere la ADP/constructor un culoar pietonal sigur la Piața Domenii și verificarea Poliției Locale pentru mașinile de pe trotuar.\n• Transmite la iluminat public avaria de pe Str. Roma (Washington – Piața Dorobanți).\n• Semnalează la Parking București panoul de pe Sfinții Voievozi 62 și la Poliția Locală ușa ANAF de pe Str. Berna.\n• Răspunde în grup la postarea despre gunoiul de pe Ivan Petrovici Pavlov (programul de colectare).", "total": 18, "id": "2026-11-25"}, {"at": "2026-11-24T18:45:00.000Z", "by": "citire detaliata 20:00", "comments": 8, "date": "2026-11-24", "poll": {"options": ["Gropi în carosabil", "Iluminat public", "Copaci și spații verzi", "Câini fără stăpân", "Terenuri ocupate ilegal"], "q": "Care e cea mai mare problemă pe strada ta?"}, "text": "Ce zic oamenii:\nÎn ultimele 2 zile (de ieri 00:00 până acum) au apărut 10 sesizări în grup. Oamenii se plâng mai ales de gropi și iluminat nereparate de luni de zile; mai mulți spun că au făcut deja sesizări fără rezultat. La craterul de pe Bd. Bucureștii Noi vecinii spun că și-au stricat roți și întreabă de despăgubiri.\n\nProblemele principale:\n• Iluminat public – Str. Renașterii (2,5 luni fără lumină), Str. Parângului nr. 8, un cartier cu lampă cu fire dezizolate – 3\n• Gropi și cratere – Bd. Bucureștii Noi (spre Pajura, după Șos. Chitilei), Str. Parcului, Str. Teodor Neagoe nr. 1 (canalizare) – 3\n• Spații verzi – copaci nou plantați căzuți pe Bd. Petroliștilor, suflante de frunze în Parcul Nicolae Iorga – 2\n• Câini fără stăpân – haită pe Str. Alexandru Bratu – 1\n• Domeniu public ocupat ilegal – Str. Marginei – 1\n\nCe s-a rezolvat sau a fost preluat:\n• Preluate și transmise: craterul de pe Bd. Bucureștii Noi (cu cerere de semnalizare) și iluminatul de pe Str. Renașterii.\n• Nimic confirmat ca rezolvat.\n\nCe rămâne fără răspuns:\n•.\n• Lampa cu fire dezizolate (revenire, pericol) – fără răspuns.\n•.\n• Craterul de la canalizare de pe Str. Teodor Neagoe nr. 1.\n• Gropile de pe Str. Parcului (sesizate repetat).\n• Copacii căzuți pe Bd. Petroliștilor (de azi dimineață).\n\nCe ai putea face azi:\n• Transmite la ASPA / Poliția Locală haita de pe Str. Alexandru Bratu și aprobă postarea ca oamenii să vadă că e preluată.\n• Cere semnalizarea urgentă a craterului de pe Bd. Bucureștii Noi și verificarea lămpii cu fire dezizolate.\n• Transmite la iluminat public Str. Parângului nr. 8 și Str. Renașterii.\n• Transmite la ADP copacii căzuți de pe Bd. Petroliștilor.\n\n", "total": 10, "id": "2026-11-24"}], "aproape": [{"items": [{"a": "Strada Petru Maior nr. 7", "c": "salubritate", "cn": "Salubritate", "i": "Deșeuri abandonate", "k": "grivita", "kn": "Grivița", "la": 44.45303, "lo": 26.0726, "r": "AP-2026-376767", "s": "preluata", "t": 1795691992988, "te": 1795779071236}, {"a": "Strada Jiului nr. 15", "c": "drumuri", "cl": 1795698160868, "cn": "Drumuri", "ei": "Administrația Străzilor București", "i": "Trotuar spart / denivelat", "k": "damaroaia", "kn": "Dămăroaia", "la": 44.48394, "lo": 26.04233, "r": "AP-2026-007840", "s": "inchisa", "t": 1795688222205, "te": 1798281528732}, {"a": "Strada Prunaru nr. 6", "c": "drumuri", "cl": 1795702430459, "cn": "Drumuri", "i": "Stâlp deteriorat/lipsă", "k": "chitila", "kn": "Chitila", "la": 44.45791, "lo": 26.05414, "r": "AP-2026-915761", "s": "inchisa", "t": 1795686327796, "te": 1796291352657}, {"a": "Strada Prunaru nr. 1", "c": "drumuri", "cl": 1795695907239, "cn": "Drumuri", "i": "Stâlp deteriorat/lipsă", "k": "chitila", "kn": "Chitila", "la": 44.45843, "lo": 26.05244, "r": "AP-2026-907718", "s": "inchisa", "t": 1795685596658, "te": 1796290935453}, {"a": "Strada Prunaru nr. 6", "c": "drumuri", "cn": "Drumuri", "i": "Stâlp deteriorat/lipsă", "k": "chitila", "kn": "Chitila", "la": 44.45829, "lo": 26.05391, "r": "AP-2026-722838", "s": "preluata", "t": 1795684548839, "te": 1796306933091}, {"a": "Strada Prunaru nr. 6", "c": "verzi", "cn": "Spații verzi", "i": "Altceva", "k": "chitila", "kn": "Chitila", "la": 44.45849, "lo": 26.05397, "r": "AP-2026-926836", "s": "preluata", "t": 1795683824821, "te": 1795965799312}, {"a": "Soseaua Gheorghe Ionescu-Sisesti nr. 262-266", "c": "drumuri", "cl": 1795686171672, "cn": "Drumuri", "ei": "Administrația Străzilor București", "i": "Capac de canal lipsă", "k": "straulesti", "kn": "Străulești", "la": 44.50633, "lo": 26.02741, "r": "AP-2026-945331", "s": "inchisa", "t": 1795676884248, "te": 1798278160522}, {"a": "Soseaua Gheorghe Io
